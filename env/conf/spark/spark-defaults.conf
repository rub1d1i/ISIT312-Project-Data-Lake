# ISIT312 data lake: defaults for spark-shell / spark-submit (Spark 2.4.8, Scala 2.11).
# Anything here can be overridden per run with  --conf key=value.

# ---- Hive: share the Hive 2.3.9 metastore service with Beeline/HiveServer2 ----------------
# Spark 2.4 ships a Hive 1.2.1 client; these two lines make it load the Hive 2.3 client classes
# from the installed Hive instead ("2.3.3" is the 2.3.x line Spark 2.4 knows about).
# The metastore address (thrift://localhost:9083) is in conf/hive-site.xml.
spark.sql.catalogImplementation     hive
spark.sql.hive.metastore.version    2.3.3
spark.sql.hive.metastore.jars       /usr/share/hive/lib/*
spark.sql.warehouse.dir             hdfs://localhost:8020/user/hive/warehouse

# ---- HBase 1.2.6 client on the driver and executor classpath ------------------------------
# Lets Scala code use ConnectionFactory/Table/Put (and TableInputFormat/TableOutputFormat)
# without any --jars. /usr/share/spark/hbase-conf holds only hbase-site.xml.
spark.driver.extraClassPath         /usr/share/spark/hbase-conf:/usr/share/hbase/lib/hbase-client-1.2.6.jar:/usr/share/hbase/lib/hbase-common-1.2.6.jar:/usr/share/hbase/lib/hbase-protocol-1.2.6.jar:/usr/share/hbase/lib/hbase-server-1.2.6.jar:/usr/share/hbase/lib/hbase-hadoop-compat-1.2.6.jar:/usr/share/hbase/lib/hbase-hadoop2-compat-1.2.6.jar:/usr/share/hbase/lib/metrics-core-2.2.0.jar
spark.executor.extraClassPath       /usr/share/spark/hbase-conf:/usr/share/hbase/lib/hbase-client-1.2.6.jar:/usr/share/hbase/lib/hbase-common-1.2.6.jar:/usr/share/hbase/lib/hbase-protocol-1.2.6.jar:/usr/share/hbase/lib/hbase-server-1.2.6.jar:/usr/share/hbase/lib/hbase-hadoop-compat-1.2.6.jar:/usr/share/hbase/lib/hbase-hadoop2-compat-1.2.6.jar:/usr/share/hbase/lib/metrics-core-2.2.0.jar

# ---- YARN (only used with --master yarn) --------------------------------------------------
# Single node: executors run on this same machine, so point them at the local Spark jars
# instead of uploading ~230 MB to HDFS on every start.
spark.yarn.jars                     local:/usr/share/spark/jars/*

# ---- Sized for one small node -------------------------------------------------------------
# Spark's default of 200 shuffle partitions makes every aggregation (and every streaming
# micro-batch with state) run 200 tiny tasks. 8 matches the 8 CPUs of the VM.
spark.sql.shuffle.partitions        8
