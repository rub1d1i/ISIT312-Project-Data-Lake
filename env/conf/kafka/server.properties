# ISIT312 data lake: single Kafka 2.8.2 broker, replication factor 1 everywhere.
broker.id=0

# Listen on every interface (so Docker's published port 9092 reaches the broker) but advertise
# "localhost:9092": clients inside the container AND clients on the Mac both use localhost:9092.
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://localhost:9092

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Topic data (the "commit log"); kept inside the container, outside the Kafka install dir.
log.dirs=/home/bigdata/kafka-data/kafka-logs
num.partitions=1
num.recovery.threads.per.data.dir=1

# One broker only, so every internal topic must also use replication factor 1.
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Kafka's own ZooKeeper (see zookeeper.properties) - NOT the HBase one on 2181.
zookeeper.connect=localhost:2182
zookeeper.connection.timeout.ms=18000

group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true
delete.topic.enable=true
