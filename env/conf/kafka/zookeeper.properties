# ISIT312 data lake: ZooKeeper used ONLY by Kafka (Kafka's bundled ZooKeeper 3.5.9).
# HBase runs its own ZooKeeper on 2181, so this one listens on 2182 to avoid the clash.
dataDir=/home/bigdata/kafka-data/zookeeper
clientPort=2182
maxClientCnxns=0
# ZooKeeper 3.5 would otherwise start an admin web server on port 8080.
admin.enableServer=false
